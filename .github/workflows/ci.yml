name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall orchestrator
      - name: Test fallback Terraform planning
        run: python -c "from orchestrator.planner import build_plan; from orchestrator.models import PlanRequest; p=build_plan(PlanRequest(request='Apply the sandbox Terraform configuration', application='sandbox', environment='dev')); assert p.steps[0].workflow == 'terraform_plan'; assert p.steps[0].inputs == {'environment': 'dev', 'action': 'apply'}; assert p.steps[0].risk == 'high'"
      - name: Test production approval policy
        run: python -c "from orchestrator.planner import build_plan; from orchestrator.models import PlanRequest; p=build_plan(PlanRequest(request='Apply the production Terraform configuration', application='sandbox', environment='prod')); assert p.approval_required; assert p.steps[0].inputs['environment'] == 'prd'"
