name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall orchestrator
      - run: python -c "from orchestrator.planner import build_plan; from orchestrator.models import PlanRequest; p=build_plan(PlanRequest(request='Upgrade ART production server to RHEL 9', application='ART', environment='prod')); assert p.approval_required; assert len(p.steps) == 5"
